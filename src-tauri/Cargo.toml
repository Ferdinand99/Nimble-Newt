[package]
name = "nimble-newt"
version = "0.4.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "A fast, modern text editor for Windows and macOS"
repository = "https://github.com/Ferdinand99/Nimble-Newt"

[lib]
name = "nimble_newt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nimble-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Remote images in the Markdown view are fetched here (the webview's CSP blocks them). Same
# version, features and TLS stack (rustls with ring) as tauri-plugin-updater, so no new crates.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Opens links from the Markdown view in the system browser (only http, https and mailto).
open = "=5.4.5"

[dev-dependencies]
tempfile = "3"
