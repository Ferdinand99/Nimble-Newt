[package]
name = "nimble-core"
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Encoding, line endings, session storage and search for Nimble Newt"

[dependencies]
encoding_rs = "0.8"
chardetng = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
regex = "1"
globset = "0.4"
thiserror = "2"
semver = "1"
similar = "2"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
toml = "1.1"
memchr = "2"
zip = { version = "9.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
