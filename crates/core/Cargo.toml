[package]
name = "nimble-core"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Encoding, line endings, session storage and search for Nimble Newt"

[dependencies]
encoding_rs = "0.8"
chardetng = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
regex = "1"
globset = "0.4"
thiserror = "2"
semver = "1"
similar = "2"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
toml = "1.1"
memchr = "2"
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
