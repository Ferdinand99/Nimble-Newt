[package]
name = "nimble-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Encoding, line endings, session storage and search for Nimble Newt"

[dependencies]
encoding_rs = "0.8"
chardetng = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
regex = "1"
globset = "0.4"
thiserror = "2"
semver = "1"

[dev-dependencies]
tempfile = "3"
