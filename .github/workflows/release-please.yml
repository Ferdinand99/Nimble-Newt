# Keeps a release PR open on main (version bump + CHANGELOG from Conventional Commits).
# Merging it tags vX.Y.Z and creates a DRAFT GitHub release. The draft is only published
# by the `publish` job after the installers, latest.json and signatures are attached.
# The release body (the changelog section) becomes the "notes" field of latest.json,
# i.e. the update changelog shown in the app.
#
# Everything runs in this workflow because tags/releases created with GITHUB_TOKEN do
# not trigger other workflows.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_id: ${{ steps.draft.outputs.release_id }}
      pr_branch: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Look up draft release id
        id: draft
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          if [ -z "$id" ]; then
            echo "::error::Could not find the release for tag $TAG"
            exit 1
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  # release-please cannot update Cargo.lock, so its versions would lag behind Cargo.toml.
  # Refresh the lockfile on the release PR branch (workspace members only, no dependency bumps).
  lockfile:
    name: Refresh Cargo.lock on the release PR
    needs: release-please
    if: needs.release-please.outputs.pr_branch != '' && needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo update --workspace
      - name: Commit if the lockfile changed
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: refresh Cargo.lock for the release"
          git push

  preflight:
    name: Preflight (updater keys)
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Check updater signing setup
        run: |
          fail=0
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error title=Missing secret::TAURI_SIGNING_PRIVATE_KEY is empty. Add it (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD) as repository secrets; see docs/updates.md."
            fail=1
          fi
          pubkey=$(jq -r '.plugins.updater.pubkey // ""' src-tauri/tauri.conf.json)
          case "$pubkey" in
            ""|REPLACE_WITH*)
              echo "::error title=Placeholder public key::plugins.updater.pubkey in src-tauri/tauri.conf.json is still a placeholder. Replace it with the public key from your signing key pair; see docs/updates.md."
              fail=1 ;;
          esac
          if [ "$fail" -ne 0 ]; then
            echo "::error::Release $TAG was NOT built or published. It remains a DRAFT, so nobody gets a release without update files. Fix the problem above, then follow 'Recovering from a failed release' in docs/updates.md."
            exit 1
          fi
          echo "Updater signing setup looks fine."

  build-release:
    name: Build release (${{ matrix.name }})
    needs: [release-please, preflight]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ""
            rust_targets: ""
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
    env:
      # Indirection so `if:` conditions can test whether a secret is set. These are
      # exported to the real variable names only in the guarded steps below, so that
      # unset secrets never show up as empty variables.
      IN_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      IN_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      IN_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      IN_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      IN_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      IN_APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
      IN_APPLE_ID: ${{ secrets.APPLE_ID }}
      IN_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      IN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IN_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      IN_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Configure macOS signing and notarization
        if: runner.os == 'macOS' && env.IN_APPLE_CERTIFICATE != ''
        shell: bash
        run: |
          {
            echo "APPLE_CERTIFICATE=$IN_APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$IN_APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$IN_APPLE_SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
          if [ -n "$IN_APPLE_API_KEY_CONTENT" ] && [ -n "$IN_APPLE_API_ISSUER" ] && [ -n "$IN_APPLE_API_KEY" ]; then
            key_path="$RUNNER_TEMP/AuthKey_${IN_APPLE_API_KEY}.p8"
            printf '%s' "$IN_APPLE_API_KEY_CONTENT" > "$key_path"
            {
              echo "APPLE_API_ISSUER=$IN_APPLE_API_ISSUER"
              echo "APPLE_API_KEY=$IN_APPLE_API_KEY"
              echo "APPLE_API_KEY_PATH=$key_path"
            } >> "$GITHUB_ENV"
            echo "Notarization: App Store Connect API key."
          elif [ -n "$IN_APPLE_ID" ] && [ -n "$IN_APPLE_PASSWORD" ] && [ -n "$IN_APPLE_TEAM_ID" ]; then
            {
              echo "APPLE_ID=$IN_APPLE_ID"
              echo "APPLE_PASSWORD=$IN_APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$IN_APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "Notarization: Apple ID."
          else
            echo "::warning::Apple certificate present but no notarization credentials; the app will be signed but not notarized."
          fi

      - name: Import Windows certificate
        if: runner.os == 'Windows' && env.IN_WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:IN_WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString $env:IN_WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          $cfg = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = 'sha256'
            timestampUrl = 'http://timestamp.digicert.com'
          } } } | ConvertTo-Json -Depth 5
          $cfgPath = Join-Path $env:RUNNER_TEMP 'tauri-windows-sign.json'
          Set-Content -Path $cfgPath -Value $cfg -Encoding utf8
          "TAURI_EXTRA_ARGS=--config `"$($cfgPath -replace '\\','/')`"" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Imported certificate with thumbprint $($cert.Thumbprint)"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # The release body (changelog written by release-please) is used as the
          # `notes` of latest.json.
          releaseId: ${{ needs.release-please.outputs.release_id }}
          tagName: ${{ needs.release-please.outputs.tag_name }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} ${{ env.TAURI_EXTRA_ARGS }}

  publish:
    name: Publish release
    needs: [release-please, build-release]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      RELEASE_ID: ${{ needs.release-please.outputs.release_id }}
    steps:
      - name: Verify update assets
        run: |
          assets=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID" --jq '.assets[].name')
          echo "$assets"
          # latest.json.new is the leftover of an interrupted "Put the changelog into latest.json" run; that step finishes it.
          if ! grep -qxE 'latest\.json(\.new)?' <<< "$assets"; then
            echo "::error::Release $TAG has no latest.json asset; leaving it as a draft."
            exit 1
          fi
          if ! grep -q '\.sig$' <<< "$assets"; then
            echo "::error::Release $TAG has no .sig asset (updater signatures); leaving it as a draft."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      # tauri-action leaves `notes` empty when it uploads to an existing release; fill it from the
      # release body (the release-please changelog) so the in-app update dialog shows what is new.
      - name: Put the changelog into latest.json
        run: |
          # Safe to run again after a failure: the new file is uploaded as latest.json.new first, so
          # latest.json is never missing without a finished replacement next to it, and a run that finds
          # the notes already in place does nothing.
          set -euo pipefail
          api="repos/${{ github.repository }}"
          asset_id() { gh api "$api/releases/$RELEASE_ID" --jq ".assets[] | select(.name == \"$1\") | .id"; }
          gh api "$api/releases/$RELEASE_ID" --jq '.body // ""' > release-body.md

          # Finish an interrupted earlier run first.
          leftover=$(asset_id latest.json.new)
          if [ -n "$leftover" ]; then
            old=$(asset_id latest.json)
            [ -z "$old" ] || gh api -X DELETE "$api/releases/assets/$old"
            gh api -X PATCH "$api/releases/assets/$leftover" -f name=latest.json > /dev/null
            echo "Finished an interrupted update of latest.json."
          fi

          id=$(asset_id latest.json)
          if [ -z "$id" ]; then
            echo "::error::Release $TAG has no latest.json asset."
            exit 1
          fi
          gh api "$api/releases/assets/$id" -H "Accept: application/octet-stream" > latest.json
          node scripts/update-notes.mjs latest.json release-body.md latest.new.json
          node -e 'const j=require("./latest.new.json"); if(!j.notes){console.error("::error::latest.json would still have empty notes"); process.exit(1)}'
          if node -e 'process.exit(require("./latest.json").notes === require("./latest.new.json").notes ? 0 : 1)'; then
            echo "latest.json already carries the changelog."
            exit 0
          fi
          new_id=$(curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
            --data-binary @latest.new.json \
            "https://uploads.github.com/$api/releases/$RELEASE_ID/assets?name=latest.json.new" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).id))')
          gh api -X DELETE "$api/releases/assets/$id"
          gh api -X PATCH "$api/releases/assets/$new_id" -f name=latest.json > /dev/null
          echo "latest.json now carries the changelog."
      - name: Publish release
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=true
          echo "Published $TAG."
